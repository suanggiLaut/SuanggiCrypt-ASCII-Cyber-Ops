<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuanggiCrypt // ASCII Cyber Ops</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --neon-green:#00ff66;
  --neon-dim:rgba(0,255,102,0.15);
  --bg-dark:#0a0d0c;
  --card-bg:rgba(13, 20, 16, 0.78);
  --border-neon:rgba(0, 255, 102, 0.35);
  --text-main:#e2fcee;
  --text-muted:#6e917d;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'SF Mono','Monaco','Consolas','Courier New',monospace}
body{
  background:var(--bg-dark);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:var(--text-main);
  overflow-x:hidden;
  position:relative;
}

/* ASCII Background Layer */
#ascii-bg{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-size:10px;
  line-height:9px;
  letter-spacing:1px;
  color:rgba(0,255,102,0.3);
  user-select:none;
  pointer-events:none;
  white-space:pre;
}

/* Glass UI Container */
.container{
  position:relative;
  z-index:10;
  background:var(--card-bg);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-radius:14px;
  box-shadow:0 0 35px rgba(0,255,102,0.12),inset 0 0 1px var(--neon-green);
  width:100%;
  max-width:620px;
  border:1px solid var(--border-neon);
  overflow:hidden;
}
.header{
  padding:20px 24px;
  border-bottom:1px solid var(--border-neon);
  background:linear-gradient(180deg,rgba(0,255,102,0.08) 0%,transparent 100%);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box i{font-size:22px;color:var(--neon-green);text-shadow:0 0 8px var(--neon-green)}
.logo-box h1{font-size:18px;letter-spacing:1.5px;text-transform:uppercase}
.cam-btn{
  background:transparent;
  border:1px solid var(--neon-green);
  color:var(--neon-green);
  padding:6px 12px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  transition:all .2s ease;
  display:flex;
  align-items:center;
  gap:6px;
}
.cam-btn:hover{background:var(--neon-green);color:#000}

.content{padding:24px}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;color:var(--neon-green);font-size:12px;letter-spacing:1px}
.input-group textarea, .input-group input{
  width:100%;
  padding:12px 14px;
  border:1px solid rgba(0,255,102,0.25);
  border-radius:8px;
  font-size:13px;
  background:rgba(5,10,7,0.7);
  color:var(--text-main);
  transition:all .2s ease;
}
.input-group textarea{height:95px;resize:vertical}
.input-group textarea:focus, .input-group input:focus{
  outline:0;
  border-color:var(--neon-green);
  box-shadow:0 0 10px rgba(0,255,102,0.25);
}

.btn-group{display:flex;gap:12px;margin-top:16px}
.btn{
  flex:1;
  padding:12px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.btn-primary{
  background:var(--neon-green);
  color:#000;
  border:0;
  box-shadow:0 0 12px rgba(0,255,102,0.3);
}
.btn-primary:hover{background:#33ff85;transform:translateY(-1px)}
.btn-secondary{
  background:rgba(0,255,102,0.06);
  color:var(--neon-green);
  border:1px solid var(--border-neon);
}
.btn-secondary:hover{background:rgba(0,255,102,0.15);transform:translateY(-1px)}

.result-container{
  margin-top:20px;
  padding:14px;
  background:rgba(0,0,0,0.6);
  border-radius:8px;
  border:1px solid var(--border-neon);
  border-left:4px solid var(--neon-green);
}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-header h3{color:var(--neon-green);font-size:12px;letter-spacing:1px}
#output{
  word-break:break-all;
  font-size:12px;
  min-height:22px;
  color:var(--text-main);
  line-height:1.5;
}
.copy-btn{
  padding:4px 10px;
  background:transparent;
  color:var(--neon-green);
  border:1px solid var(--neon-green);
  border-radius:4px;
  cursor:pointer;
  font-size:11px;
}
.copy-btn:hover{background:var(--neon-green);color:#000}
.footer{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  color:var(--text-muted);
  font-size:11px;
  padding-top:12px;
  border-top:1px solid rgba(0,255,102,0.15);
}
</style>
</head>
<body>

<pre id="ascii-bg"></pre>
<video id="webcam" playsinline style="display:none"></video>
<canvas id="hidden-canvas" style="display:none"></canvas>

<div class="container">
  <div class="header">
    <div class="logo-box">
      <i class="fas fa-terminal"></i>
      <h1>SuanggiCrypt // OS</h1>
    </div>
    <button class="cam-btn" onclick="toggleWebcam()"><i class="fas fa-video"></i> <span id="cam-txt">ASCII Cam</span></button>
  </div>
  <div class="content">
    <div class="input-group">
      <label for="inputText">> TEXT_PAYLOAD</label>
      <textarea id="inputText" placeholder="Tulis pesan rahasia atau paste ciphertext di sini..."></textarea>
    </div>
    <div class="input-group">
      <label for="passphrase">> SECRET_PASSPHRASE</label>
      <input type="password" id="passphrase" placeholder="Ketik kata sandi enkripsi...">
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="processCrypto('encrypt')"><i class="fas fa-lock"></i> Encrypt</button>
      <button class="btn btn-secondary" onclick="processCrypto('decrypt')"><i class="fas fa-unlock"></i> Decrypt</button>
    </div>
    <div class="result-container">
      <div class="result-header">
        <h3>> CONSOLE_OUTPUT</h3>
        <button class="copy-btn" onclick="copyResult()"><i class="fas fa-copy"></i> COPY</button>
      </div>
      <div id="output">-</div>
    </div>
    <div class="footer">
      <span>ALGO: AES-256-GCM / 250K ITER</span>
      <span>STATUS: LOCALHOST_ISOLATED</span>
    </div>
  </div>
</div>

<script>
/* 1. ASCII WEBCAM / CANVAS ENGINE */
const asciiChars = "@%#*+=-:. ";
const asciiBg = document.getElementById("ascii-bg");
const video = document.getElementById("webcam");
const canvas = document.getElementById("hidden-canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

let isCameraActive = false;
let streamRef = null;
const cols = 120;
const rows = 45;

canvas.width = cols;
canvas.height = rows;

function generateFallbackAscii() {
  if (isCameraActive) return;
  let str = "";
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const rnd = Math.random();
      str += rnd > 0.94 ? "#" : rnd > 0.88 ? "*" : rnd > 0.82 ? ":" : rnd > 0.75 ? "." : " ";
    }
    str += "\n";
  }
  asciiBg.textContent = str;
}
setInterval(generateFallbackAscii, 120);

async function toggleWebcam() {
  const btnTxt = document.getElementById("cam-txt");
  if (!isCameraActive) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
      video.srcObject = stream;
      await video.play();
      streamRef = stream;
      isCameraActive = true;
      btnTxt.textContent = "Cam Active";
      renderAsciiFrame();
    } catch (e) {
      alert("Akses kamera ditolak atau perangkat tidak ditemukan. Menjalankan fallback ASCII.");
    }
  } else {
    if (streamRef) streamRef.getTracks().forEach(t => t.stop());
    isCameraActive = false;
    btnTxt.textContent = "ASCII Cam";
  }
}

function renderAsciiFrame() {
  if (!isCameraActive) return;
  ctx.drawImage(video, 0, 0, cols, rows);
  const imgData = ctx.getImageData(0, 0, cols, rows).data;
  let frame = "";

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const idx = (y * cols + x) * 4;
      const brightness = (imgData[idx] * 0.299 + imgData[idx + 1] * 0.587 + imgData[idx + 2] * 0.114);
      const charIndex = Math.floor((brightness / 255) * (asciiChars.length - 1));
      frame += asciiChars[charIndex];
    }
    frame += "\n";
  }
  asciiBg.textContent = frame;
  requestAnimationFrame(renderAsciiFrame);
}

/* 2. AES-256-GCM WEB CRYPTO CORE */
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(passphrase, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function processCrypto(action) {
  const text = document.getElementById("inputText").value.trim();
  const password = document.getElementById("passphrase").value;
  const out = document.getElementById("output");

  if (!text || !password) {
    alert("Isi teks dan passphrase terlebih dahulu!");
    return;
  }

  try {
    if (action === "encrypt") {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const cipherBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));

      const combined = new Uint8Array(salt.length + iv.length + cipherBuf.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(cipherBuf), salt.length + iv.length);

      out.textContent = btoa(String.fromCharCode(...combined));
    } else {
      const raw = atob(text);
      const data = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) data[i] = raw.charCodeAt(i);

      if (data.length < 28) throw new Error("Ciphertext tidak valid.");
      const salt = data.slice(0, 16);
      const iv = data.slice(16, 28);
      const ciphertext = data.slice(28);

      const key = await deriveKey(password, salt);
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      out.textContent = dec.decode(plainBuf);
    }
  } catch (err) {
    out.textContent = "[!] DECRYPT_ERROR: Key salah atau data rusak/dimodifikasi.";
  }
}

function copyResult() {
  const c = document.getElementById("output").textContent;
  if (c && c !== "-") {
    navigator.clipboard.writeText(c).then(() => alert("Ciphertext disalin!"));
  }
}
</script>
</body>
</html>
